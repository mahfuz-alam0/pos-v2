name: Build desktop apps

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # A GitHub release always needs a tag, so derive one from package.json
          # + the run number instead of requiring a manual `git tag`.
          TAG: v${{ github.run_number }}
          RUN: ${{ github.run_number }}
        run: |
          version=$(node -p "require('./package.json').version" 2>/dev/null || echo 0.1.0)
          gh api "repos/$GH_REPO/releases" \
            -f tag_name="$TAG" \
            -f name="POS $version (build $RUN)" \
            -f body="Desktop builds for macOS, Windows and Linux." \
            -F draft=true \
            -F prerelease=false \
            -f target_commitish="$GITHUB_SHA" \
            --jq '.id' | xargs -I{} echo "release_id={}" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg,app
          # Intel Mac
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg,app
          # AppImage is omitted: linuxdeploy fails to bundle the `server` resource
          # directory (a bun sidecar + Next.js standalone tree, not an ELF it can
          # trace). deb + rpm cover Linux.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: node scripts/strip-secure.test.mjs

      - name: Write .env.local
        shell: bash
        env:
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_ECCOMMERCE_URL: ${{ secrets.NEXT_PUBLIC_ECCOMMERCE_URL }}
          NEXT_PUBLIC_CHAT_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_CHAT_SERVICE_URL }}
          NEXT_PUBLIC_CHAT_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_CHAT_CLIENT_ID }}
          NEXT_PUBLIC_CHAT_ID: ${{ secrets.NEXT_PUBLIC_CHAT_ID }}
          NEXT_PUBLIC_CHAT_APP_SECRET: ${{ secrets.NEXT_PUBLIC_CHAT_APP_SECRET }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_AES_SECRET: ${{ secrets.NEXT_PUBLIC_AES_SECRET }}
          NEXT_PUBLIC_ENCRYPTION_KEY: ${{ secrets.NEXT_PUBLIC_ENCRYPTION_KEY }}
          PIXLAB_API_KEY: ${{ secrets.PIXLAB_API_KEY }}
        run: |
          for key in NEXT_PUBLIC_BASE_URL NEXT_PUBLIC_ECCOMMERCE_URL \
                     NEXT_PUBLIC_CHAT_SERVICE_URL NEXT_PUBLIC_CHAT_CLIENT_ID \
                     NEXT_PUBLIC_CHAT_ID NEXT_PUBLIC_CHAT_APP_SECRET \
                     NEXT_PUBLIC_GOOGLE_MAPS_API_KEY NEXT_PUBLIC_AES_SECRET \
                     NEXT_PUBLIC_ENCRYPTION_KEY PIXLAB_API_KEY; do
            value="${!key}"
            [ -n "$value" ] && printf '%s=%s\n' "$key" "$value" >> .env.local
          done
          printf 'Wrote %s env vars\n' "$(wc -l < .env.local 2>/dev/null || echo 0)"

      - name: Fetch x86_64 Bun for Intel Mac cross-build
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          curl -fsSL -o bun.zip https://github.com/oven-sh/bun/releases/latest/download/bun-darwin-x64.zip
          unzip -q bun.zip -d bun-x64
          chmod +x bun-x64/bun-darwin-x64/bun
          echo "SIDECAR_BUN=$PWD/bun-x64/bun-darwin-x64/bun" >> "$GITHUB_ENV"
          echo "SIDECAR_TARGET=x86_64-apple-darwin" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_TAURI: "1"
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false
