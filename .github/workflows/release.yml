name: Build desktop apps

on:
  push:
    branches:
      # - desktop-release
      - mfz-dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # A GitHub release always needs a tag, so derive one from package.json
          # + the run number instead of requiring a manual `git tag`.
          TAG: v${{ github.run_number }}
          RUN: ${{ github.run_number }}
        run: |
          version=$(node -p "require('./package.json').version" 2>/dev/null || echo 0.1.0)

          # gh api's exit status doesn't reliably propagate through a pipe into
          # `--jq` + `xargs`, so a transient GitHub outage (a non-JSON error
          # body) can silently end up as the "release_id" instead of failing
          # the step. Capture the raw response first, validate it produced a
          # numeric id, and retry a few times before giving up.
          release_id=""
          for attempt in 1 2 3; do
            response=$(gh api "repos/$GH_REPO/releases" \
              -f tag_name="$TAG" \
              -f name="POS $version (build $RUN)" \
              -f body="Desktop builds for macOS, Windows and Linux." \
              -F draft=true \
              -F prerelease=false \
              -f target_commitish="$GITHUB_SHA" 2>&1) && \
              release_id=$(echo "$response" | jq -r '.id // empty' 2>/dev/null)

            [[ "$release_id" =~ ^[0-9]+$ ]] && break

            echo "Attempt $attempt: failed to create release — $response" >&2
            release_id=""
            sleep 10
          done

          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to create GitHub release after 3 attempts. Last response: $response"
            exit 1
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon
          # dmg wraps the .app as an intermediate step regardless, so omitting
          # the "app" target just skips publishing the raw .app.tar.gz.
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          # Intel Mac
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          # AppImage is omitted: linuxdeploy fails to bundle the `server` resource
          # directory (a bun sidecar + Next.js standalone tree, not an ELF it can
          # trace). deb + rpm cover Linux.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm
          # msi only — nsis (.exe) is redundant with it.
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles msi

    runs-on: ${{ matrix.platform }}

    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # sccache can't cache incremental artifacts, so incremental compilation
      # just adds overhead without a matching upside on CI runners.
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            patchelf
            rpm
            build-essential
            curl
            wget
            file
            libxdo-dev
            libssl-dev
          version: 1.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: node scripts/strip-secure.test.mjs

      - name: Write .env.local
        shell: bash
        env:
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_ECCOMMERCE_URL: ${{ secrets.NEXT_PUBLIC_ECCOMMERCE_URL }}
          NEXT_PUBLIC_CHAT_SERVICE_URL: ${{ secrets.NEXT_PUBLIC_CHAT_SERVICE_URL }}
          NEXT_PUBLIC_CHAT_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_CHAT_CLIENT_ID }}
          NEXT_PUBLIC_CHAT_ID: ${{ secrets.NEXT_PUBLIC_CHAT_ID }}
          NEXT_PUBLIC_CHAT_APP_SECRET: ${{ secrets.NEXT_PUBLIC_CHAT_APP_SECRET }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_AES_SECRET: ${{ secrets.NEXT_PUBLIC_AES_SECRET }}
          NEXT_PUBLIC_ENCRYPTION_KEY: ${{ secrets.NEXT_PUBLIC_ENCRYPTION_KEY }}
          PIXLAB_API_KEY: ${{ secrets.PIXLAB_API_KEY }}
        run: |
          for key in NEXT_PUBLIC_BASE_URL NEXT_PUBLIC_ECCOMMERCE_URL \
                     NEXT_PUBLIC_CHAT_SERVICE_URL NEXT_PUBLIC_CHAT_CLIENT_ID \
                     NEXT_PUBLIC_CHAT_ID NEXT_PUBLIC_CHAT_APP_SECRET \
                     NEXT_PUBLIC_GOOGLE_MAPS_API_KEY NEXT_PUBLIC_AES_SECRET \
                     NEXT_PUBLIC_ENCRYPTION_KEY PIXLAB_API_KEY; do
            value="${!key}"
            [ -n "$value" ] && printf '%s=%s\n' "$key" "$value" >> .env.local
          done
          printf 'Wrote %s env vars\n' "$(wc -l < .env.local 2>/dev/null || echo 0)"

      - name: Fetch x86_64 Bun for Intel Mac cross-build
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          curl -fsSL -o bun.zip https://github.com/oven-sh/bun/releases/latest/download/bun-darwin-x64.zip
          unzip -q bun.zip -d bun-x64
          chmod +x bun-x64/bun-darwin-x64/bun
          echo "SIDECAR_BUN=$PWD/bun-x64/bun-darwin-x64/bun" >> "$GITHUB_ENV"
          echo "SIDECAR_TARGET=x86_64-apple-darwin" >> "$GITHUB_ENV"

      - name: Write Apple API key
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      - name: Import Apple signing certificate
        # tauri-action imports APPLE_CERTIFICATE itself, but only right before
        # its own final app-bundle signing step — too late for build-sidecar.mjs
        # (run via beforeBuildCommand, much earlier) to use the identity to
        # re-sign bundled native binaries (see next step). Import it ourselves
        # into a keychain on the search list so it's available the whole job.
        #
        # Also imports Apple's Developer ID intermediate: the exported .p12
        # contains only the leaf cert, not the chain, so notarization can't
        # validate anything signed with it unless this is present too.
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_TAURI: "1"
          # Auto-update backend not ready yet — no signed update artifacts needed.
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false
